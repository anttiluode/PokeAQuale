name: PokeAQuale CI

on:
  push:
  pull_request:

jobs:
  gate0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gate 0 — poke invariance
        run: python experiments/gate0_poke_invariance.py
