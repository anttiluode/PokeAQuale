name: PokeAQuale CI

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gate 0 — poke invariance
        run: python experiments/gate0_poke_invariance.py
      - name: Gate 1 — embodiment refines quotient
        run: python experiments/gate1_embodiment_refines_quotient.py
