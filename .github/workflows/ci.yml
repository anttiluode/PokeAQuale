name: PokeAQuale CI

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gate 0 — poke invariance
        run: python experiments/gate0_poke_invariance.py
      - name: Gate 1 — embodiment refines quotient
        run: python experiments/gate1_embodiment_refines_quotient.py
      - name: Gate 2 — multi-step counterfactuals
        run: python experiments/gate2_multistep_counterfactuals.py
      - name: Gate 3 — owned versus external poke
        run: python experiments/gate3_owned_vs_external_poke.py
      - name: Gate 4 — memory does not create observation
        run: python experiments/gate4_memory_does_not_create_observation.py
      - name: Gate 5 — active to immediate distillation
        run: python experiments/gate5_active_to_immediate_distillation.py
      - name: Gate 6 — automorphism stopping line
        run: python experiments/gate6_automorphism_stopping_line.py
      - name: Gate 7 — cross-embodiment alignment
        run: python experiments/gate7_cross_embodiment_alignment.py
      - name: Gate 8 — homeostatic anchor
        run: python experiments/gate8_homeostatic_anchor.py
      - name: Gate 9 — future-affordance causality
        run: python experiments/gate9_future_affordance_causality.py
      - name: Gate 10 — causal bottleneck versus SELF
        run: python experiments/gate10_causal_bottleneck_vs_self.py
      - name: Gate 11 — causal structure does not create valence
        run: python experiments/gate11_causal_structure_does_not_create_valence.py
      - name: Gate 12 — reward non-identifiability
        run: python experiments/gate12_reward_nonidentifiability.py
      - name: Gate 13 — selection masquerades as preference
        run: python experiments/gate13_selection_masquerades_as_preference.py
      - name: Gate 14 — slow prior fast correction
        run: python experiments/gate14_slow_prior_fast_correction.py
      - name: Gate 15 — three-timescale observer
        run: python experiments/gate15_three_timescale_observer.py
      - name: Gate 16 — silent drift audit cost
        run: python experiments/gate16_silent_drift_audit_cost.py
